name: Fetch World Cup Schedule

on:
  workflow_dispatch:

jobs:
  update_schedule:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetch_schedule script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node fetch_schedule.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add upcoming_matches.json played_matches.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): update upcoming and played matches"
            git push
          else
            echo "No changes to matches."
          fi
